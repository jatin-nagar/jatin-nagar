<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nested loops</title>
</head>
<body>
    <button onclick="nestedloops()">nestedloops</button>
    <button onclick="number()">check</button>
    <script>
        function nestedloops(){
            for(var i=0;i<3;i++){
                for(var j=1;j<=4;j++){
                    document.write(j+" ")
                }
                document.write("<br>")
            }

        }

        // 1 1 1
        // 2 2 2
        // 3 3 3

        function number(){
            for(var p=1;p<=4;p++){
                for(var j=1;j<=3;j++){
                    document.write(p+" ")
                }
                document.write("<br>")
            }
        }
    </script>
    
</body>
</html>
