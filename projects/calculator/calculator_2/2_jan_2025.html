<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" href="2_jan_2025.css">
</head>
<body>
    <div class="main">
        <h1>calculator</h1>
        <div class="header">
    <input type="text" name="usename" value="" id="screen">
    <div class="button">
        <button class="clear operator">AC</button>
        <button class="btn operator">%</button>
        <button class="btn operator">/</button>
        <button class="btn operator">*</button>
        <button class="btn">7</button>
        <button class="btn">8</button>

        <button class="btn">9</button>
        <button class="btn operator">+</button>
        <button class="btn">4</button>
        <button class="btn">5</button>

        <button class="btn">6</button>
        <button class="btn operator">-</button>
        <button class="btn">1</button>
        <button class="btn">2</button>

        <button class="btn">3</button>
        <button class="solve operator">=</button>   
        <button class="btn">0</button>
        <button class="btn">00</button>
        <button class="btn">.</button>
        <button class="back btn operator">clr</button>
    </div>
</div>
    </div>
    <script src="2_jan_2025.js"></script>
</body>
</html>
