// Input: “python programming performs major role in DA”
// Output: “python @rogramming @erforms major role in DA”

let par = 'python programming performs major role in DA'
 document.write(par.replace(/p/g,'@') +'<br>')

// 4.  Write a Python function to compress a string by replacing repeated characters with their count.

// # Output: "a3b4c3"

// repeat

// "Emma is a data scientist who knows Python. Emma works at google".
