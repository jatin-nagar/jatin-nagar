        // 2. Write a program to accept two numbers and mathematical operators and perform operations accordingly.

        function number_and_mathematical(){
            var first_number=Number(document.getElementById("first_number").value)
            var second_number=Number(document.getElementById("second_number").value)
            var sign=document.getElementById("operators").value
            if(sign=="+"){
                var add=first_number+second_number
                document.getElementById("check_result").innerHTML=add
            }
            else if(sign=="-"){
                var subtract=first_number-second_number
                document.getElementById("check_result").innerHTML=subtract
            }
            else if(sign=="*"){
                var multiply=first_number*second_number
                document.getElementById("check_result").innerHTML=multiply
            }
            else if(sign=="/"){
                var divide=first_number/second_number
                document.getElementById("check_result").innerHTML=divide
            }

        }

    //    3. Accept the number of days from the user and calculate the charge for library according to following:

    function library_charges(){
        var days=Number(document.getElementById("enter_charges").value)
        if(days<=5){
            var price=days*2
            document.getElementById("library_bill").value=price
        }
        else if(days>5 & days<=10){
            var price=days*3
            document.getElementById("library_bill").value=price
        }
        else if(days>10 & days<=15){
            var price=days*4
            document.getElementById("library_bill").value=price
        }
        else{
            var price=days*5
            document.getElementById("library_bill").value=price
        }
    }
