        // 1. Write a  Python program to find those numbers which are divisible by 7 and multiples of 5, between 1500 and 2700 (both included).

        function find_number(){
            var num = Number(prompt("enter number"));
            for (i = 1500; i <= 2700; i++) {
                if (num % 7 == 0 && num % 5 == 0) {
                    document.getElementById("result2").innerHTML = "divisible by 7and multiple of 5"
                }
                else {
                    document.getElementById("result2").innerHTML = " not divisible by 7and multiple of 5"

                }
            }
        }

        function integer() {
            var start = Number(prompt("enter the value"))

            var sum = 0;
            for (var n = start; n <= end; n++) {

                document.write(n + "<br>")
                sum = sum + n;
            }
            document.write("sum=" + sum)
        }

        // 2.  Use a for loop to calculate the sum of numbers from 1 to 100 and print the result.

        function number() {
            var sum = 0;

            }

        // 3.   Write a JavaScript program to calculate the factorial of a given number using a for loop.

        function fact(){
            var factorial_num=Number(document.getElementById("factorial number"))
            var factorial=1;
            for(var n=1;n<factorial_num;n++){
                factorial=factorial*n;
            }

        }
        // 7. Write a program to reverse a given number using a while loop.
       function reverse(){
        var num=Number(document.getElementById("number").value);
        var reverse=0
        while(num>0){
            var last_digit=num%10;//1234%10=4,
            reverse=reverse*10+last_digit//0*10+4=4
            num=parseInt(num/10)//1234/10=123
        }
        document.getElementById("result").innerHTML="reverse number"+reverse
       }

// 9. Write a program to check if a given number is a palindrome using a single loop. Use a while loop to reverse the number and compare it to the original.
function palindrone(){
    var num=Number(document.getElementById("number").value)
    var original=num
    var reverse=0
    while(num>0){
            var last_digit=num%10;//1234%10=4,
            reverse=reverse*10+last_digit//0*10+4=4
            num=parseInt(num/10)//1234/10=123
        }
        if(original==reverse)
        document.getElementById("result").innerHTML="number is palindrone"
    else{
        document.getElementById("result").innerHTML="number is not palindrone"
    }
}

// 6.  Write a program to check whether a given number is an Armstrong number using a while loop. Use the break statement to exit the loop if an intermediate condition is met (like detecting a zero in the number).
function armstrong(){
            var num=Number(document.getElementById("num").value);
            sum=0;
            original=num;
            while(num>0){
                var rem=num%10;
                sum=sum+rem**3;
                num=parseInt(num/10);
            }
            if(original==sum){
                document.getElementById("result").innerHTML="It is an Armstrong Number";
            }
            else{
                document.getElementById("result").innerHTML="It is not an Armstrong Number";
            }
        }

    //    10. Write a program to find out if the given number is prime or not .

        function prime(){
            var num1=Number(document.getElementById("num1").value);
            for(var i=2;i<num1;i++){
                if(num1%i==0){
                    document.getElementById("result").innerHTML="It is not a prime Number";
                    break;
                }
                else{
                   document.getElementById("result").innerHTML="It is a prime Number";
                }
            }
        }
